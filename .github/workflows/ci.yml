name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required files
        run: |
          for f in LICENSE README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md .gitleaks.toml; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scan the whole history with the CLI: the action computes a commit range
      # that does not resolve after a force-push or a rebase.
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep "${archive}" checksums.txt | sha256sum --check
          tar -xzf "${archive}" gitleaks
          ./gitleaks detect --redact -v --exit-code=2

  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      # The generated Prisma client is not committed, and lint needs its types.
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # Dependency direction and circular imports (dependency-cruiser.config.mjs).
      - name: Check architecture
        run: pnpm lint:architecture
      # Unused files, exports and dependencies (knip.jsonc).
      - name: Check for dead code
        run: pnpm knip
      # Runs the unit tests and fails below the coverage floors of each package.
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build

  integration:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      # No password: the service container only listens inside this job, and trust auth keeps
      # any credential out of the workflow file.
      DATABASE_URL: postgresql://entana_ci@localhost:5432/entana_ci
    services:
      postgres:
        # Same major version as docker-compose.yml.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: entana_ci
          POSTGRES_DB: entana_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entana_ci -d entana_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      # Catches a change to schema.prisma without its migration. The hand-written CHECK
      # constraints do not show up as a difference (Prisma does not introspect them).
      - name: Apply migrations
        run: pnpm --filter @entana/database exec prisma migrate deploy
      - name: Check that schema.prisma and the migrations are in sync
        run: pnpm --filter @entana/database exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Integration tests (PostgreSQL)
        run: pnpm test:integration

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate PR title (Conventional Commits)
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
