name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required files
        run: |
          for f in LICENSE README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md .gitleaks.toml; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - name: Check the dependency release-age policy
        run: |
          # Read the values pnpm applies, not the file text: a comment or a typo cannot fool this.
          # corepack installs the pnpm version pinned in package.json.
          corepack enable
          age=$(pnpm config get minimumReleaseAge --json)
          strict=$(pnpm config get minimumReleaseAgeStrict --json)
          exclude=$(pnpm config get minimumReleaseAgeExclude --json)
          case "$age" in ''|*[!0-9]*) echo "minimumReleaseAge must be set to a number of minutes (got: $age)"; exit 1;; esac
          [ "$age" -ge 1440 ] || { echo "minimumReleaseAge must be at least 1440 minutes (got: $age)"; exit 1; }
          [ "$strict" = "true" ] || { echo "minimumReleaseAgeStrict must be true (got: $strict)"; exit 1; }
          [ "$exclude" = "[]" ] || { echo "minimumReleaseAgeExclude must be empty (got: $exclude)"; exit 1; }

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scan the whole history with the CLI: the action computes a commit range
      # that does not resolve after a force-push or a rebase.
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep "${archive}" checksums.txt | sha256sum --check
          tar -xzf "${archive}" gitleaks
          ./gitleaks detect --redact -v --exit-code=2

  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      # The generated Prisma client is not committed, and lint needs its types.
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # Dependency direction and circular imports (dependency-cruiser.config.mjs).
      - name: Check architecture
        run: pnpm lint:architecture
      # Unused files, exports and dependencies (knip.jsonc).
      - name: Check for dead code
        run: pnpm knip
      # Runs the unit tests and fails below the coverage floors of each package.
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
      # Throwaway CI values for a container that only lives inside this job. The password here
      # and in POSTGRES_PASSWORD below must stay identical.
      DATABASE_URL: postgresql://entana_ci:ci-only-7Kq2mX9vLd4R@localhost:5432/entana_ci
    services:
      postgres:
        # Same major version as docker-compose.yml.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: entana_ci
          POSTGRES_PASSWORD: ci-only-7Kq2mX9vLd4R
          POSTGRES_DB: entana_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entana_ci -d entana_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      # Runs psql inside the service container (the runner's own psql is not guaranteed). The
      # publish filter selects the one container that publishes port 5432.
      - name: Print the PostgreSQL server version
        run: |
          container=$(docker ps --filter ancestor=postgres:18-alpine --filter publish=5432 --format '{{.ID}}')
          docker exec "${container}" psql -U entana_ci -d entana_ci -c 'SHOW server_version'
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      # Catches a change to schema.prisma without its migration. The hand-written CHECK
      # constraints do not show up as a difference (Prisma does not introspect them).
      - name: Apply migrations
        run: pnpm --filter @entana/database exec prisma migrate deploy
      - name: Check that schema.prisma and the migrations are in sync
        run: pnpm --filter @entana/database exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      # One step per suite, through Turborepo: --filter keeps the task dependencies (db:generate,
      # ^build). Each suite creates its own throwaway database (test_ and lowercase hex) on this
      # server, applies the migrations to it and drops it at the end, also on a termination signal.
      # The role is the superuser of the service image, so it is allowed to create databases.
      - name: Database integration tests
        run: pnpm test:integration --filter=@entana/database
      - name: API integration tests
        run: pnpm test:integration --filter=@entana/api

  # Builds the production image and tests it from outside, through the published port: the
  # image's own health check runs inside the container and cannot see a wrong HOST.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t entana-api:ci .
      # Informational for now: findings never fail the build. To be made blocking on fixable
      # critical findings once the baseline is known. SARIF upload to GitHub code scanning
      # is to be added when the repository is public (it needs a paid plan while private).
      # fail-build only covers the severity cutoff: if the scanner itself cannot run
      # (database download, image not found) the step still fails, and the next step fails
      # on a missing or empty report.
      - name: Scan the image for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: entana-api:ci
          fail-build: false
          severity-cutoff: high
          # Hide vulnerabilities without a fix: the goal is to see what we can actually act on.
          only-fixed: true
          output-format: table
          output-file: grype-report.txt
      - name: Show the vulnerability report
        run: |
          test -s grype-report.txt || { echo "::error::The scan produced no report."; exit 1; }
          cat grype-report.txt
          {
            echo '## Image vulnerabilities (fixable, HIGH and above)'
            echo '```'
            cat grype-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Refuses to start without DATABASE_URL
        run: |
          status=0
          output=$(timeout 30 docker run --rm entana-api:ci 2>&1) || status=$?
          test "${status}" != "0" || { echo "::error::The container started without DATABASE_URL."; exit 1; }
          echo "${output}" | grep -q "DATABASE_URL" || { echo "::error::The output does not name DATABASE_URL (exit code ${status})."; exit 1; }
          echo "The container refused to start without DATABASE_URL (exit code ${status})."
      - name: Start the API container
        # Fake value: the client does not connect until the first query.
        run: |
          docker run -d --name entana-api-ci -p 3000:3000 \
            -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=3000 \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/test \
            entana-api:ci
      - name: Wait until the API answers from the host
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/api/v1/health; then
              echo "The API answered on attempt ${attempt}."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The API never answered on http://localhost:3000/api/v1/health (30 tries, 2 seconds apart)."
          exit 1
      - name: Check the HTTP status
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/health)
          test "${status}" = "200" || { echo "::error::Expected HTTP 200, got ${status}."; exit 1; }
      - name: Check the Cache-Control header
        run: |
          value=$(curl -s -D - -o /dev/null http://localhost:3000/api/v1/health | tr -d '\r' | awk -F': ' 'tolower($1) == "cache-control" { print $2 }')
          test "${value}" = "no-store" || { echo "::error::Expected Cache-Control: no-store, got '${value}'."; exit 1; }
      - name: Check the response body
        run: |
          body=$(curl -s http://localhost:3000/api/v1/health)
          echo "${body}"
          echo "${body}" | grep -q '"status":"ok"' || { echo '::error::The body does not contain "status":"ok".'; exit 1; }
      - name: Check that the process does not run as root
        run: |
          uid=$(docker exec entana-api-ci id -u)
          test "${uid}" != "0" || { echo "::error::The container runs as root."; exit 1; }
          echo "The container runs as uid ${uid}."
      - name: Wait until Docker reports the container healthy
        run: |
          for attempt in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' entana-api-ci)
            if [ "${health}" = "healthy" ]; then
              echo "The container is healthy."
              exit 0
            fi
            echo "Health status: ${health}"
            sleep 2
          done
          echo "::error::The container was not healthy after 60 seconds."
          exit 1
      - name: Check the graceful shutdown
        run: |
          SECONDS=0
          docker stop -t 10 entana-api-ci
          code=$(docker inspect --format '{{.State.ExitCode}}' entana-api-ci)
          echo "Exit code ${code} after ${SECONDS} seconds."
          test "${code}" = "0" || { echo "::error::Expected exit code 0, got ${code}."; exit 1; }
          test "${SECONDS}" -lt 10 || { echo "::error::The shutdown took ${SECONDS} seconds."; exit 1; }
      - name: Print the container logs
        if: failure()
        run: docker logs entana-api-ci
      - name: Remove the container
        if: always()
        run: docker rm -f entana-api-ci

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate PR title (Conventional Commits)
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
