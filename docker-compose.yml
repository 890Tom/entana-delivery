# PostgreSQL for local development. Credentials come from the root .env file (see .env.example).
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Loopback only: the database must not be reachable from the network.
      # 5433 on the host so that it does not clash with a PostgreSQL installed locally.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+ images keep a versioned data directory under /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API image. Behind the "app" profile: a plain `docker compose up` starts only the database.
  # Start it with `docker compose --profile app up -d --build api`.
  api:
    profiles: ["app"]
    image: entana-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Literal values on purpose: a HOST or PORT exported in the shell or set in .env must not
      # override what the container needs (HOST=127.0.0.1 would make it unreachable).
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # Built from the database service's own variables, host = service name, container port.
      # Compose cannot percent-encode: the password must use only URL-safe characters
      # (letters, digits, - . _ ~) for this service.
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Empty means no cross-origin browser is allowed.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  postgres_data:
