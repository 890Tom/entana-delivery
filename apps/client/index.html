<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entana Delivery</title>
    <!-- Same values as public/manifest.webmanifest: a deployment changes both together. -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Last in the page so that it wins the cascade; deployment-specific, never bundled. -->
    <link rel="stylesheet" href="/theme.local.css" />
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
